
plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

// ═══ قراءة local.properties ═══
def localProps = new Properties()
def localFile = rootProject.file('local.properties')
if (localFile.exists()) {
    localProps.load(new FileInputStream(localFile))
}
def getLocalProp = { String key, String defaultVal = "" ->
    return localProps.getProperty(key) ?: defaultVal
}


android {
    buildFeatures {
        buildConfig true
    }

    namespace 'com.ummah.admin'
    compileSdk 35

    defaultConfig {
        buildConfigField "String", "ADMIN_PASSWORD", "\"${getLocalProp('ADMIN_PASSWORD', 'ummah2026')}\""
        applicationId "com.ummah.admin"
        minSdk 21
        targetSdk 35
        versionCode 2
        versionName "2.0"
    }

    signingConfigs {
        release {
            storeFile file("../ummah-release.keystore")
            storePassword getLocalProp("KEYSTORE_PASSWORD", System.getenv("KEYSTORE_PASSWORD") ?: "")
            keyAlias "ummah"
            keyPassword getLocalProp("KEY_PASSWORD", System.getenv("KEY_PASSWORD") ?: "")
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // ═══ Lint: تجاهل duplicate classes من google-auth ═══
    lint {
        abortOnError false
        checkReleaseBuilds false
        disable 'DuplicatePlatformClasses', 'InvalidPackage'
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt',
                         'META-INF/NOTICE', 'META-INF/NOTICE.txt']
        }
    }
}

configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.10'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.10'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.10'
    }

}

dependencies {

    // ═══ FCM HTTP v1 API ═══
    implementation 'com.google.auth:google-auth-library-oauth2-http:1.19.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    implementation 'androidx.core:core:1.12.0'
    implementation platform('com.google.firebase:firebase-bom:32.7.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
}
