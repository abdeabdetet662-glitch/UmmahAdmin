name: Build Ummah Admin

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDK=/usr/local/lib/android/sdk
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # ═══ إنشاء Keystore من Secret ═══
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > ${{ github.workspace }}/ummah-release.keystore
          ls -la ${{ github.workspace }}/ummah-release.keystore

      # ═══ إنشاء local.properties من Secrets ═══
      - name: Create local.properties
        run: |
          cat > local.properties << EOF
          KEYSTORE_FILE=ummah-release.keystore
          KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS=${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}
          ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
          EOF

      # ═══ بناء Release APK ═══
      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      # ═══ بناء Debug APK (للاختبار) ═══
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      # ═══ رفع Release APK ═══
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: UmmahAdmin-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      # ═══ رفع Debug APK ═══
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: UmmahAdmin-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
